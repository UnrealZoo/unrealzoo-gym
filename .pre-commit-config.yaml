repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
        files: ^gym_unrealcv/envs/setting/(Navigation|Rendezvous|Rescue|Track)/custom_.*\.json$
      - id: pretty-format-json
        files: ^gym_unrealcv/envs/setting/(Navigation|Rendezvous|Rescue|Track)/custom_.*\.json$
        args: [--indent=2, --no-sort-keys]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.18.1
    hooks:
      - id: markdownlint-cli2
        files: ^doc/task_config\.md$
        args: [--config, .markdownlint-cli2.jsonc]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        files: ^gym_unrealcv/__init__\.py$
        args: [--ignore, F401, --ignore, F522]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        files: ^gym_unrealcv/__init__\.py$
        args: [--ignore-missing-imports, --follow-imports=silent, --disable-error-code=str-format]