[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gym_unrealcv"
description = "Gymnasium environments for UnrealCV"
dynamic = ["version"]
dependencies = [
    "gymnasium>=0.29,<1.1",
    "matplotlib",
    "numpy",
    "unrealcv>=1.1.5",
    "wget",
    "opencv-python",
    "simple_pid",
    "pynput",
    "docker",
    "modelscope"
]
authors = [
    { name = "Fangwei Zhong", email = "zfw1226@gmail.com" },
    { name = "Kui Wu" }
]

[tool.setuptools.package-data]
"gym_unrealcv" = ["envs/setting/**/*"]

[tool.setuptools]
packages = ["gym_unrealcv"]

[tool.setuptools.dynamic]
version = {attr = "gym_unrealcv.__version__"}

[project.optional-dependencies]
legacy-gym = [
    "gym>=0.26,<0.27"
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
testpaths = [
    "tests"
]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
follow_imports = "skip"
files = [
    "gym_unrealcv/envs/utils/transforms.py",
    "gym_unrealcv/envs/utils/types.py"
]